steps:
  - name: Checkout Code
    uses: actions/checkout@v4

  - name: Set up Python ${{ matrix.python-version }}
    uses: actions/setup-python@v5
    with:
      python-version: ${{ matrix.python-version }}
      cache: 'pip'

  - name: Install Dependencies
    run: |
      python -m pip install --upgrade pip
      pip install black flake8 isort pytest joblib scikit-learn pandas numpy
      if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

  - name: Linting and Formatting
    run: |
      # Ensure code follows PEP8 standards
      black --check .
      isort --check-only .
      flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  - name: ML Model Sanity Check
    # This ensures the .pkl files are not corrupted and can actually predict
    run: |
      python -c "
      import joblib
      import pandas as pd
      try:
          model = joblib.load('svm_sentiment_svm_model.pkl')
          test_df = pd.DataFrame({'Review': ['test'], 'Ratings': [5]})
          model.predict(test_df)
          print('Model Integrity Verified.')
      except Exception as e:
          print(f'Model Load Failed: {e}')
          exit(1)
      "
