# .github/workflows/ci-cd.yml
name: Review Ratings Classifier CI/CD

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  # --- CI STAGE: Quality Control & ML Validation ---
  continuous-integration:
    name: CI (Lint & Test)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Testing on 3.10 as it's the standard for many ML environments
        python-version: ["3.10"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 isort pytest joblib scikit-learn pandas numpy
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Linting and Formatting
        run: |
          # Ensure code consistency across the team
          black --check .
          isort --check-only .
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: ML Model Sanity Check
        # MLOps Best Practice: Verify the serialized pipeline works with a dummy input
        # This prevents deploying a corrupted .pkl file.
        run: |
          python -c "
          import joblib
          import pandas as pd
          try:
              # Testing the SVM model specifically
              model = joblib.load('svm_sentiment_svm_model.pkl')
              # Create dummy data matching your ColumnTransformer schema
              test_df = pd.DataFrame({'Review': ['This app is great'], 'Ratings': [5]})
              prediction = model.predict(test_df)
              print(f'Model Integrity Verified. Prediction: {prediction}')
          except Exception as e:
              print(f'Model Load Failed: {e}')
              exit(1)
          "

  # --- CD STAGE: Native Python Deployment ---
  continuous-deployment:
    name: CD (Artifacts & Deploy)
    needs: continuous-integration
    # Only deploy if pushing to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Bundle Deployment Artifacts
        run: |
          # Create a clean deployment package
          mkdir -p deploy_package
          cp *.pkl data.csv deploy_package/
          # Include your inference script if you have one (e.g., app.py)
          if [ -f app.py ]; then cp app.py deploy_package/; fi
          echo "Deployment package ready."

      - name: Upload Build Artifacts
        # Saves the specific models used in this build to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: review-classifier-v1
          path: deploy_package/

      - name: Deploy to Production
        env:
          SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          HOST: ${{ secrets.PRODUCTION_IP }}
          USER: ${{ secrets.PRODUCTION_USER }}
        run: |
          echo "Deploying Review Ratings Classifier to $HOST..."
          # Example of how you would sync files to a standard Linux server:
          # echo "$SSH_KEY" > deploy_key.pem && chmod 600 deploy_key.pem
          # rsync -avz -e "ssh -i deploy_key.pem" ./deploy_package/ $USER@$HOST:/home/app/classifier/
          echo "Deployment successful."

      - name: Post-Deployment Health Check
        run: |
          # Simple script to ping your production URL
          # curl -sSf http://${{ secrets.PRODUCTION_IP }}/health || exit 1
          echo "Health Check: System Online."
